<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Gestión de Turnos</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta">
            <h1>Crear cuenta</h1>
            <p>Completá tus datos para registrarte.</p>

            <!-- Las dos pestañas alternan qué campos se piden -->
            <div class="pestanas" id="pestanas">
                <button type="button" data-tipo="paciente" class="activa">Soy paciente</button>
                <button type="button" data-tipo="medico">Soy médico</button>
            </div>

            <form id="formRegistro">

                <div data-campos="paciente">
                    <label for="dni">DNI</label>
                    <input type="number" id="dni" placeholder="30100101">

                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Juan">

                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" placeholder="Pérez">

                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento">
                </div>

                <div data-campos="medico" class="oculta">
                    <label for="matricula">Matrícula</label>
                    <input type="number" id="matricula" placeholder="1001">
                </div>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="usuario@correo.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>

                <button type="submit">Crear cuenta</button>
            </form>

            <p id="mensaje" role="status" aria-live="polite"></p>

            <p class="pie-tarjeta">
                ¿Ya tenés cuenta? <a href="../index.html">Iniciar sesión</a>
            </p>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/registro.js"></script>
</body>
</html>
